<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Незнайка в Солнечном городе — интерактивный квест</title>
<style>
:root{
  --sky:#bfe6ff;
  --sky2:#e8f7ff;
  --sun:#ffd23f;
  --orange:#ff8c42;
  --red:#e84545;
  --blue:#3f7ede;
  --deep:#2c5fb3;
  --green:#6cbf4a;
  --green-d:#3f8c2c;
  --purple:#9b5de5;
  --pink:#ff77a8;
  --ink:#2b2a4a;
  --paper:#fffdf5;
  --line:#e2dcc8;
  --shadow:0 10px 0 rgba(43,42,74,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Comic Sans MS","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 82% 12%, #fff6c9 0 90px, transparent 91px),
    radial-gradient(circle at 12% 88%, #d8f5c8 0 140px, transparent 141px),
    linear-gradient(180deg,#bfe6ff 0%, #e8f7ff 45%, #fdf6e3 100%);
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.85) 0 26px, transparent 27px),
    radial-gradient(circle, rgba(255,255,255,.55) 0 18px, transparent 19px);
  background-size:340px 200px, 260px 160px;
  background-position:40px 40px, 180px 120px;
  opacity:.7;
}
.app{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:12px 14px 60px}

/* ---------- HUD ---------- */
.hud{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:rgba(255,255,255,.82);
  border:3px solid #fff;
  box-shadow:0 8px 22px rgba(44,95,179,.15);
  border-radius:22px;
  padding:8px 14px;
  margin-bottom:14px;
  backdrop-filter:blur(4px);
}
.hud .logo{
  font-weight:700;font-size:15px;line-height:1.1;
  color:var(--deep);
  display:flex;align-items:center;gap:8px;
}
.hud .logo span.sun{font-size:22px}
.hud .stars{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap}
.hud .star{font-size:19px;filter:grayscale(1);opacity:.35;transition:.25s}
.hud .star.on{filter:none;opacity:1;transform:scale(1.12)}
.hud .mini{
  border:none;background:#eef4ff;color:var(--deep);
  font:inherit;font-size:13px;font-weight:700;
  padding:8px 12px;border-radius:14px;cursor:pointer;
}
.hud .mini:hover{background:#dde9ff}

/* ---------- generic ---------- */
.card{
  background:var(--paper);
  border-radius:26px;
  border:4px solid #fff;
  box-shadow:0 12px 0 rgba(43,42,74,.10), 0 20px 40px rgba(44,95,179,.14);
  padding:20px;
}
h1{font-size:clamp(22px,4vw,34px);margin:0 0 6px;color:var(--deep);line-height:1.1}
h2{font-size:clamp(19px,3vw,25px);margin:0 0 10px;color:var(--deep)}
p{line-height:1.5}
.muted{color:#6d6a8c}
.btn{
  border:none;font:inherit;font-weight:700;cursor:pointer;
  background:var(--orange);color:#fff;
  padding:14px 26px;border-radius:18px;font-size:18px;
  box-shadow:0 6px 0 #d96a20;
  transition:transform .08s, box-shadow .08s, filter .2s;
}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d96a20}
.btn.blue{background:var(--blue);box-shadow:0 6px 0 var(--deep)}
.btn.blue:active{box-shadow:0 2px 0 var(--deep)}
.btn.green{background:var(--green);box-shadow:0 6px 0 var(--green-d)}
.btn.green:active{box-shadow:0 2px 0 var(--green-d)}
.btn.ghost{background:#fff;color:var(--deep);box-shadow:0 6px 0 #d5e2f6}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}
.spacer{flex:1}

/* ---------- intro ---------- */
.intro-grid{display:grid;grid-template-columns:1fr 240px;gap:18px;align-items:center}
@media(max-width:720px){.intro-grid{grid-template-columns:1fr}}
.intro-text{font-size:17px}
.namebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.namebox input{
  font:inherit;font-size:17px;padding:12px 16px;border-radius:16px;
  border:3px solid #cfe0f5;background:#fff;min-width:200px;color:var(--ink);
}
.namebox input:focus{outline:none;border-color:var(--blue)}
.bubble{
  position:relative;background:#fff;border:3px solid #cfe0f5;border-radius:20px;
  padding:14px 16px;font-size:16px;line-height:1.45;box-shadow:0 8px 0 rgba(44,95,179,.08);
}
.bubble::after{
  content:"";position:absolute;left:34px;bottom:-14px;
  border:10px solid transparent;border-top-color:#cfe0f5;
}

/* ---------- map ---------- */
.map-wrap{position:relative;margin-top:6px}
.route-grid{
  display:grid;gap:14px;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
}
.station-card{
  position:relative;text-align:left;cursor:pointer;
  background:#fff;border:3px solid #fff;border-radius:22px;
  padding:14px 14px 14px 58px;
  box-shadow:0 8px 0 rgba(43,42,74,.10);
  transition:transform .12s, box-shadow .12s;
  font:inherit;color:inherit;
  min-height:92px;
}
.station-card:hover{transform:translateY(-3px);box-shadow:0 11px 0 rgba(43,42,74,.12)}
.station-card .num{
  position:absolute;left:12px;top:14px;
  width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);
}
.station-card .nm{font-weight:700;font-size:16px;line-height:1.15;display:block}
.station-card .sub{font-size:12.5px;color:#79769a;display:block;margin-top:4px}
.station-card .mark{position:absolute;right:10px;top:10px;font-size:18px}
.station-card.locked{opacity:.55;cursor:not-allowed;filter:saturate(.4)}
.station-card.locked:hover{transform:none;box-shadow:0 8px 0 rgba(43,42,74,.10)}
.station-card.done{background:#f2fbee;border-color:#d9f0cd}
.station-card .icon-big{position:absolute;right:12px;bottom:6px;font-size:30px;opacity:.22}

/* ---------- station shell ---------- */
.st-top{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
@media(max-width:640px){
  .st-top{grid-template-columns:86px 1fr;gap:10px}
  .st-top .st-kicker{font-size:11px}
  .soda-grid{max-width:330px}
  .mitten-grid{gap:7px}
  .tile{width:56px;height:56px;font-size:22px}
  .opt{font-size:19px;padding:10px 14px;min-width:52px}
  .card{padding:14px;border-radius:20px}
  .hud{gap:8px;padding:8px 10px}
  .hud .logo{font-size:13px}
  .hud .star{font-size:15px}
}
@media(max-width:480px){
  .st-top{grid-template-columns:1fr;justify-items:center;text-align:center}
  .st-top>div:first-child{width:104px}
  .st-top .task-head{text-align:left}
  .zoo-grid{grid-template-columns:1fr 1fr}
  .zoo-card{padding:8px}
  .zoo-card .ex{font-size:18px}
  .photo-opts{grid-template-columns:1fr}
}
.st-hero{width:100%;filter:drop-shadow(0 8px 8px rgba(43,42,74,.16))}
.st-kicker{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8f8bb3}
.task{
  margin-top:16px;background:#fff;border:3px dashed #d8e3f3;border-radius:20px;padding:16px;
}
.task-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qmark{
  flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--sun);
  display:grid;place-items:center;font-weight:700;font-size:20px;color:#9a6b00;
  box-shadow:0 3px 0 #e0b000;
}
.task-head .txt{font-size:16px;line-height:1.4;padding-top:4px}
.progressline{height:12px;background:#e9eef8;border-radius:99px;overflow:hidden;margin:0 0 14px}
.progressline > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6cbf4a,#ffd23f);border-radius:99px;transition:width .35s}
.feedback{min-height:26px;font-weight:700;font-size:16px;margin-top:10px}
.feedback.ok{color:var(--green-d)}
.feedback.no{color:var(--red)}
.st-footer{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}

/* ---------- answers ---------- */
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{
  font:inherit;font-weight:700;font-size:22px;cursor:pointer;
  min-width:64px;padding:12px 18px;border-radius:16px;
  background:#fff;color:var(--deep);border:3px solid #cfe0f5;
  box-shadow:0 5px 0 #dbe7f7;transition:.12s;
}
.opt:hover{border-color:var(--blue);transform:translateY(-2px)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #dbe7f7}
.opt.good{background:#e6f8dd;border-color:var(--green);color:var(--green-d);box-shadow:0 5px 0 #bfe3ab}
.opt.bad{background:#ffe7e7;border-color:var(--red);color:var(--red);box-shadow:0 5px 0 #f3bcbc}
.eq{font-size:clamp(24px,5vw,34px);font-weight:700;letter-spacing:.02em}

/* train */
.train-svg{width:100%;height:auto;display:block;margin:0 auto;max-width:640px}

/* soda grid */
.soda-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  max-width:420px;margin:0 auto;
  background:#eaf6e2;border:3px solid #cde8bd;border-radius:18px;padding:8px;
}
.soda-cell{
  position:relative;aspect-ratio:1/1;border-radius:12px;background:#fff;
  border:2px solid #d7e9cb;display:grid;place-items:center;cursor:pointer;
  transition:.15s;overflow:hidden;
}
.soda-cell:hover{border-color:var(--green)}
.soda-cell.fixed{background:#f4fbef;cursor:default}
.soda-cell.fixed::after{content:"🔒";position:absolute;right:4px;top:2px;font-size:11px;opacity:.55}
.soda-cell svg{width:74%;height:74%}
.soda-cell.flash-bad{animation:shake .4s}
.soda-grid.bad{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* zoo */
.zoo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.zoo-card{
  background:#fff;border:3px solid #ffe0b8;border-radius:18px;padding:12px;
  display:flex;flex-direction:column;gap:10px;align-items:center;
  transition:.2s;
}
.zoo-card.solved{border-color:var(--green);background:#f4fbef}
.zoo-card .ex{font-size:24px;font-weight:700;color:var(--deep)}
.zoo-card .small-opts{display:flex;gap:6px}
.zoo-card .small-opts .opt{font-size:17px;min-width:46px;padding:8px 10px;border-width:2px;box-shadow:0 4px 0 #dbe7f7}

/* chess numbers */
.target-box{
  width:110px;height:110px;border-radius:22px;background:linear-gradient(160deg,#ffe9a8,#ffd23f);
  display:grid;place-items:center;font-size:46px;font-weight:700;color:#8a5a00;
  margin:0 auto 6px;box-shadow:0 6px 0 #e0b000;border:4px solid #fff;
}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.tile{
  width:66px;height:66px;border-radius:18px;background:#fff;border:3px solid #d3c4f5;
  color:#5b3fa6;font-weight:700;font-size:26px;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 5px 0 #e2d8fb;transition:.12s;
}
.tile:hover{transform:translateY(-3px)}
.tile.sel{background:#efe6ff;border-color:var(--purple);transform:translateY(-3px) scale(1.04)}
.tile.ok{background:#e6f8dd;border-color:var(--green);color:var(--green-d);box-shadow:0 5px 0 #bfe3ab}
.chess-fig{font-size:26px;line-height:1}

/* mittens */
.mitten-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:0 auto}
@media(max-width:520px){.mitten-grid{grid-template-columns:repeat(3,1fr)}}
.mitten{
  background:#fff;border:3px solid #e6e1f2;border-radius:18px;padding:6px;
  cursor:pointer;transition:.15s;position:relative;aspect-ratio:1/1;display:grid;place-items:center;
}
.mitten svg{width:100%;height:100%}
.mitten:hover{transform:translateY(-3px);border-color:var(--pink)}
.mitten.sel{border-color:var(--purple);background:#f7f0ff;transform:translateY(-3px)}
.mitten.matched{opacity:.45;border-color:var(--green);background:#f3fbef;cursor:default;transform:none}
.mitten.matched::after{content:"✓";position:absolute;right:6px;top:2px;color:var(--green-d);font-weight:700;font-size:20px}

/* spot the difference */
.diff-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.diff-wrap{grid-template-columns:1fr}}
.diff-panel{background:#fff;border:3px solid #ffd9e6;border-radius:18px;padding:6px;position:relative}
.diff-panel svg{width:100%;height:auto;display:block;border-radius:12px}
.diff-panel .lbl{position:absolute;top:8px;left:10px;font-size:12px;font-weight:700;color:#b0567d;background:#fff;padding:2px 8px;border-radius:99px;border:2px solid #ffd9e6}
.hotspot{cursor:pointer;fill:rgba(255,255,255,0.001)}
.found-ring{fill:none;stroke:#e84545;stroke-width:3;stroke-dasharray:7 5}
@keyframes spin{to{transform:rotate(360deg)}}

/* shelf */
.shelf-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.shelf{
  background:#fff;border:3px solid #e3ddcb;border-radius:16px;padding:8px;cursor:pointer;
  transition:.15s;
}
.shelf:hover{transform:translateY(-3px);border-color:var(--blue)}
.shelf.pick{border-color:var(--green);background:#f4fbef}
.shelf.bad{border-color:var(--red);background:#fff1f1;animation:shake .4s}
.shelf .cap{font-size:12px;font-weight:700;color:#8f8bb3;text-align:center;margin-top:4px}

/* photo */
.photo-scene{
  background:#fff;border:6px solid #fff;border-radius:18px;overflow:hidden;
  box-shadow:0 10px 0 rgba(43,42,74,.10);max-width:720px;margin:0 auto;
}
.photo-scene svg{display:block;width:100%;height:auto}
.timer{
  position:relative;height:14px;border-radius:99px;background:#eee;overflow:hidden;max-width:720px;margin:12px auto 0;
}
.timer > i{display:block;height:100%;background:var(--orange);width:100%}
.photo-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:720px;margin:0 auto}
@media(max-width:560px){.photo-opts{grid-template-columns:1fr}}
.photo-opt{background:#fff;border:4px solid #fff;border-radius:16px;padding:4px;cursor:pointer;box-shadow:0 8px 0 rgba(43,42,74,.10);transition:.15s}
.photo-opt svg{display:block;width:100%;height:auto;border-radius:10px}
.photo-opt:hover{transform:translateY(-3px)}
.photo-opt.pick{outline:5px solid var(--green)}
.photo-opt.bad{outline:5px solid var(--red)}

/* quiz */
.quiz-q{font-size:19px;font-weight:700;margin:6px 0 12px;color:var(--deep)}
.quiz-opts{display:flex;flex-direction:column;gap:10px;max-width:620px}
.quiz-opt{
  text-align:left;font:inherit;font-size:17px;font-weight:700;cursor:pointer;
  background:#fff;border:3px solid #cfe0f5;border-radius:16px;padding:13px 16px;
  color:var(--ink);box-shadow:0 5px 0 #dbe7f7;transition:.12s;
}
.quiz-opt:hover{border-color:var(--blue);transform:translateY(-2px)}
.quiz-opt.good{background:#e6f8dd;border-color:var(--green);box-shadow:0 5px 0 #bfe3ab}
.quiz-opt.bad{background:#ffe7e7;border-color:var(--red);border-color:var(--red);box-shadow:0 5px 0 #f3bcbc}

/* final */
.cert{
  background:linear-gradient(180deg,#fffdf3,#fff8dc);
  border:6px double var(--orange);border-radius:24px;padding:26px;text-align:center;
  max-width:760px;margin:14px auto;
}
.cert h2{font-size:clamp(20px,4vw,30px);margin-top:4px}
.cert .name{font-size:clamp(22px,4.5vw,34px);color:var(--orange);font-weight:700;border-bottom:3px dashed #f3d59a;display:inline-block;padding:0 12px 4px;margin:8px 0}
.cert .stars-big{font-size:26px;letter-spacing:4px;margin:10px 0}
.confetti{position:fixed;top:-20px;width:12px;height:18px;border-radius:3px;z-index:0;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);
  background:var(--ink);color:#fff;padding:12px 22px;border-radius:16px;font-weight:700;
  opacity:0;transition:.3s;pointer-events:none;z-index:100;font-size:15px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid #e2dcc8;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;color:#6d6a8c}
</style>
</head>
<body>
<div class="app">
  <header class="hud" id="hud"></header>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>
<script>
/* =========================================================
   НЕЗНАЙКА В СОЛНЕЧНОМ ГОРОДЕ — интерактивный квест
   Часть 1: утилиты и рисованные персонажи
   ========================================================= */

/* ---------- утилиты ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

let ACTX = null;
function ac() {
  if (!ACTX) { try { ACTX = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ACTX = null; } }
  return ACTX;
}
function beep(freq, dur, type, vol) {
  const ctx = ac(); if (!ctx) return;
  try {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.value = vol || 0.06;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.stop(ctx.currentTime + dur + 0.02);
  } catch (e) {}
}
const sndOk = () => { beep(660, .1); setTimeout(() => beep(990, .14), 90); };
const sndErr = () => { beep(200, .2, 'square', .04); };
const sndWin = () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .16), i * 110)); };
const sndPop = () => beep(440, .07, 'triangle', .05);

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* =========================================================
   ПЕРСОНАЖИ
   ========================================================= */
function person(o) {
  o = Object.assign({
    hat: 'floppy', hatColor: '#3f7ede', hatDark: '#2c5fb3',
    hair: '#f0872e', skin: '#ffd9b3',
    shirt: '#ff8c42', tie: '#6cbf4a', pants: '#f5c542', shoes: '#2f4f9e',
    dress: null, glasses: false, ponytail: false, bow: '#e84545',
    hairShort: false
  }, o || {});

  const hairBack = o.hairShort
    ? `<path d="M50 54 q0 -34 30 -34 q30 0 30 34 q0 6 -4 8 q-26 -12 -52 0 q-4 -2 -4 -8 z" fill="${o.hair}"/>`
    : `<path d="M48 56 q-4 -40 32 -40 q36 0 32 40 q-2 16 -8 18 q2 -22 -24 -22 q-26 0 -24 22 q-6 -2 -8 -18 z" fill="${o.hair}"/>`;

  const tufts = o.hairShort ? '' : `
    <path d="M49 50 q-17 7 -19 27 q14 6 21 -7 z" fill="${o.hair}"/>
    <path d="M111 50 q17 7 19 27 q-14 6 -21 -7 z" fill="${o.hair}"/>`;

  const ponytail = o.ponytail ? `
    <circle cx="114" cy="42" r="13" fill="${o.hair}"/>
    <path d="M118 30 q12 6 10 20 q-8 4 -14 -4 z" fill="${o.hair}"/>
    <path d="M104 32 l14 -8 l2 14 z" fill="${o.bow}"/>
    <circle cx="111" cy="31" r="5" fill="${o.bow}"/>` : '';

  let hat = '';
  if (o.hat === 'floppy') {
    hat = `
      <path d="M33 42 C35 4 58 -8 80 -8 C102 -8 125 4 127 42 Z" fill="${o.hatColor}"/>
      <path d="M60 -2 C68 12 92 12 100 -2 C94 -6 86 -8 80 -8 C74 -8 66 -6 60 -2 Z" fill="${o.hatDark}" opacity=".35"/>
      <ellipse cx="80" cy="42" rx="53" ry="13" fill="${o.hatColor}"/>
      <ellipse cx="80" cy="40" rx="53" ry="12" fill="none" stroke="${o.hatDark}" stroke-width="2" opacity=".55"/>
      <path d="M40 30 q10 -24 34 -30 q-22 12 -26 32 z" fill="#ffffff" opacity=".25"/>`;
  } else if (o.hat === 'cap') {
    hat = `

function shelfSVG(cfg) {
  // cfg: {kind:'sample'|variant, order:[...], flowerBook, tiltBook}
  const c = cfg;
  const book = (type, x, tilt) => {
    const col = { pink: '#ff9dc4', blue: '#a7d8f5', yellow: '#ffe066' }[type];
    const dark = { pink: '#e0719c', blue: '#7cbde0', yellow: '#e0b800' }[type];
    let deco = '';
    if (type === 'pink') deco = `<rect x="${x + 5}" y="44" width="16" height="3" fill="#fff" opacity=".8"/><rect x="${x + 5}" y="52" width="16" height="3" fill="#fff" opacity=".8"/>`;
    if (type === 'blue') deco = `<rect x="${x + 4}" y="34" width="18" height="24" rx="3" fill="#fff" opacity=".75"/><circle cx="${x + 13}" cy="46" r="6" fill="#ffb26b"/>`;
    if (type === 'yellow') deco = `<text x="${x + 13}" y="52" font-size="20" font-weight="bold" fill="#e84545" text-anchor="middle" font-family="Trebuchet MS,sans-serif">А</text>`;
    const flower = (type === c.flowerBook)
      ? `<g transform="translate(${x + 13},18)"><circle r="4" fill="#ffd23f"/><g fill="#ff77a8"><circle cx="0" cy="-7" r="4"/><circle cx="6.6" cy="-2" r="4"/><circle cx="4" cy="6" r="4"/><circle cx="-4" cy="6" r="4"/><circle cx="-6.6" cy="-2" r="4"/></g><rect x="-2" y="8" width="4" height="10" fill="#6cbf4a"/></g>`
      : '';
    const ang = (type === c.tiltBook) ? -14 : 0;
    return `<g transform="rotate(${ang} ${x + 13} 55)">
      <rect x="${x}" y="24" width="26" height="62" rx="4" fill="${col}" stroke="${dark}" stroke-width="2"/>
      <rect x="${x}" y="24" width="7" height="62" rx="3" fill="${dark}" opacity=".45"/>
      <rect x="${x + 8}" y="27" width="2" height="56" fill="#fff" opacity=".5"/>
      ${deco}${flower}

  };
  const pos = [22, 78, 132];
  const books = c.order.map((t, i) => book(t, pos[i], c.tiltBook)).join('');
  return `<svg viewBox="0 0 180 100" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="86" width="180" height="12" rx="4" fill="#c98a3c"/>
    <rect x="0" y="86" width="180" height="4" rx="2" fill="#e0a85e"/>
    ${books}
  </svg>`;
}

/* ---------- математика: варианты ответов ---------- */
function withDistractors(a, n) {
  const s = new Set([a]);
  let guard = 0;
  while (s.size < n && guard++ < 200) {
    const d = a + rnd(-3, 3);
    if (d >= 0) s.add(d);
  }
  return shuffle(Array.from(s));
}

let state = { name: '', done: new Array(9).fill(false), started: false };
function saveState() { try { localStorage.setItem('solnechny-gorod', JSON.stringify(state)); } catch (e) {} }
function loadState() {
  try {
    const raw = localStorage.getItem('solnechny-gorod');
    if (raw) {
      const p = JSON.parse(raw);
      if (p && Array.isArray(p.done)) state = Object.assign(state, p);
      while (state.done.length < 9) state.done.push(false);
    }
  } catch (e) {}
}

        { ok: true, cfg: { order: ['pink', 'blue', 'yellow'], flowerBook: 'pink', tiltBook: 'pink' }, cap: 'полка 1' },
        { ok: false, cfg: { order: ['blue', 'pink', 'yellow'], flowerBook: 'pink', tiltBook: 'pink' }, cap: 'полка 2' },
        { ok: false, cfg: { order: ['pink', 'blue', 'yellow'], flowerBook: 'blue', tiltBook: 'pink' }, cap: 'полка 3' },
        { ok: false, cfg: { order: ['pink', 'blue', 'yellow'], flowerBook: 'pink', tiltBook: null }, cap: 'полка 4' }
      ];
      const mixed = shuffle(variants);
      stage.innerHTML = `
        <div style="border:4px solid #e84545;border-radius:16px;padding:8px;max-width:420px;margin:0 auto;background:#fff">
          ${shelfSVG(sample)}
        </div>
        <div class="shelf-opts" style="margin-top:16px">
          ${mixed.map((v, i) => '<div class="shelf" data-ok="' + (v.ok ? 1 : 0) + '">' + shelfSVG(v.cfg) + '<div class="cap">' + (i + 1) + '</div></div>').join('')}
        </div>`;
      stage.addEventListener('click', e => {
        const s = e.target.closest('.shelf'); if (!s || s.dataset.locked) return;
        if (s.dataset.ok === '1') {
          s.classList.add('pick'); s.dataset.locked = '1'; sndOk(); api.step(1, 1);
          api.finish('Точно такая же полка! Незнайка уже несёт книжки малышам.');
        } else {
          s.classList.add('bad'); sndErr();
          api.no('Не эта. Посмотри на порядок книг, на наклон и на цветочек.');
          setTimeout(() => s.classList.remove('bad'), 600);
        }
      });
    }
  },

  /* ---------------- 8 ---------------- */
  {
    id: 'photo', num: 8, icon: '📷', color: '#6cbf4a', hero: 'neznaika',
    title: 'Правильная фотография',
    story: 'Незнайка решил стать настоящим фотографом. «Фотография — моментальное искусство. Бац — и готово!» — говорил он. Но сначала надо было запомнить улицу Зелёного города.',
    task: 'Запомни улицу, которую снимал Незнайка. Через несколько секунд картинка исчезнет — и нужно выбрать ту фотографию, которую он сделал.',
    mount(stage, api) {
      const variants = [
        { ok: true, cfg: {}, cap: '' },
        { ok: false, cfg: { mirror: true }, cap: '' },
        { ok: false, cfg: { kid: false }, cap: '' },
        { ok: false, cfg: { roof: '#6cbf4a' }, cap: '' }
      ];
      const mixed = shuffle(variants);
      stage.innerHTML = `
        <div class="photo-scene" id="scene">${photoScene({})}</div>
        <div class="timer"><i id="tbar"></i></div>
        <div class="muted small" id="tmsg" style="text-align:center;margin-top:8px">Запоминай… 7</div>
        <div id="photoStage" style="margin-top:14px"></div>`;
      let left = 7;
      const bar = $('#tbar', stage), msg = $('#tmsg', stage);
      const iv = setInterval(() => {
        left--;
        bar.style.width = Math.max(0, left / 7 * 100) + '%';
        msg.textContent = 'Запоминай… ' + Math.max(0, left);
        if (left <= 0) {
          clearInterval(iv);
          $('#scene', stage).style.display = 'none';
          bar.style.display = 'none';
          msg.innerHTML = 'А теперь выбери правильную фотографию:';
          const ps = $('#photoStage', stage);
          ps.innerHTML = '<div class="photo-opts">' + mixed.map((v, i) =>
            '<div class="photo-opt" data-ok="' + (v.ok ? 1 : 0) + '">' + photoScene(v.cfg) + '</div>').join('') + '</div>';
        }
      }, 1000);

      stage.addEventListener('click', e => {
        const p = e.target.closest('.photo-opt'); if (!p || p.dataset.locked) return;
        if (p.dataset.ok === '1') {
          p.classList.add('pick'); p.dataset.locked = '1';
          sndOk(); api.step(1, 1);
          api.finish('Это и есть кадр Незнайки! Фотография получилась правильная.');
        } else {
          p.classList.add('bad'); sndErr();
          api.no('Не этот кадр. Вспомни: дома, цветок и малыши стояли иначе.');
          setTimeout(() => p.classList.remove('bad'), 700);
        }
      });
    }
  },

  /* ---------------- 9 ---------------- */
  {
    id: 'quiz', num: 9, icon: '🎈', color: '#e84545', hero: 'neznaika',
    title: 'Возвращение в Солнечный город',
    story: 'Путешествие подходит к концу. Знайка проверяет, хорошо ли ты запомнил историю Незнайки и его друзей.',
    task: 'Ответь на четыре вопроса о книге Николая Носова «Незнайка в Солнечном городе».',
    mount(stage, api) {
      const qs = [
        {
          q: 'Как звали малышку, с которой Незнайка подружился и которая очень любила наряжаться?',
          opts: ['Кнопочка', 'Синеглазка', 'Мушка'], a: 'Кнопочка'
        },
        {
          q: 'Что подарил Незнайке волшебник, чтобы исполнялись добрые желания?',
          opts: ['Волшебную палочку', 'Шахматного коня', 'Газированный автомобиль'], a: 'Волшебную палочку'
        },
        {
          q: 'На чём работали автомобили в Солнечном городе?',
          opts: ['На газированной воде с сиропом', 'На дровах', 'На солнечных батареях'], a: 'На газированной воде с сиропом'
        },
        {
          q: 'Кто в Солнечном городе был архитектором и придумывал удивительные дома?',
          opts: ['Кубик', 'Пачкуля Пестренький', 'Винтик'], a: 'Кубик'
        }
      ];
      let qi = 0;
      stage.innerHTML = '<div id="qwrap"></div>';
      const wrap = $('#qwrap', stage);
      function render() {
        const it = qs[qi];
        wrap.innerHTML = `
          <div class="muted small">Вопрос ${qi + 1} из ${qs.length}</div>
          <div class="quiz-q">${it.q}</div>
          <div class="quiz-opts">${shuffle(it.opts).map(o =>
            '<button class="quiz-opt" data-v="' + o + '">' + o + '</button>').join('')}</div>`;
        wrap.querySelectorAll('.quiz-opt').forEach(b => {
          b.addEventListener('click', () => {
            if (b.disabled) return;
            if (b.dataset.v === it.a) {
              b.classList.add('good'); sndOk();
              wrap.querySelectorAll('.quiz-opt').forEach(x => x.disabled = true);
              qi++; api.step(qi, qs.length);
              api.ok('Верно!');
              if (qi >= qs.length) api.finish('Знайка доволен: историю ты знаешь на отлично!');
              else setTimeout(render, 750);
            } else {
              b.classList.add('bad'); sndErr();
              api.no('Не угадал. Подумай ещё!');
              setTimeout(() => b.classList.remove('bad'), 700);
            }
          });
        });
      }
      render();
    }
  }
];

/* =========================================================
   ОБОЛОЧКА
   ========================================================= */
let current = 0;

function renderHUD() {
  const done = state.done.filter(Boolean).length;
  $('#hud').innerHTML = `
    <div class="logo"><span class="sun">☀️</span> Незнайка в Солнечном городе</div>
    <div class="stars">${state.done.map(d => '<span class="star' + (d ? ' on' : '') + '">⭐</span>').join('')}</div>
    <button class="mini" id="toMap">Карта</button>
    <button class="mini" id="reset">Начать заново</button>`;
  $('#toMap').onclick = showMap;
  $('#reset').onclick = () => {
    if (!confirm('Начать путешествие заново? Все звёздочки сбросятся.')) return;
    state = { name: state.name, done: new Array(9).fill(false), started: true };
    saveState(); renderHUD(); showMap();
  };
  void done;
}

function confettiBurst(n) {
  const colors = ['#ffd23f', '#ff8c42', '#e84545', '#3f7ede', '#6cbf4a', '#9b5de5', '#ff77a8'];
  for (let i = 0; i < (n || 30); i++) {
    const d = document.createElement('div');
    d.className = 'confetti';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.background = colors[i % colors.length];
    d.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
    d.style.animationDelay = (Math.random() * 0.4) + 's';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 3600);
  }
}

function showIntro() {
  const view = $('#view');
  view.innerHTML = `
    <div class="card">
      <div class="intro-grid">
        <div>
          <div class="st-kicker">Интерактивный квест · 7–10 лет</div>
          <h1>Незнайка в Солнечном городе</h1>
          <p class="intro-text">Незнайка, Кнопочка и Пачкуля Пестренький отправляются в Солнечный город —
          город удивительных домов, газированных автомобилей и шахматных площадей.
          Пройди девять станций, реши задания — и собери все девять звёздочек!</p>
          <div class="bubble" style="margin-top:14px">
            Привет! Я Незнайка. Один я точно заблужусь в таком большом городе.
            Пойдёшь со мной? Как тебя зовут?
          </div>
          <div class="namebox">
            <input id="pname" maxlength="20" placeholder="Твоё имя" value="${state.name || ''}">
            <button class="btn" id="startBtn">В путь! →</button>
          </div>
          <p class="small muted" style="margin-top:12px">Задания: счёт, логика, внимание и память — по мотивам книги Николая Носова.</p>
        </div>
        <div>${charSVG('neznaika')}</div>
      </div>
    </div>`;
  const go = () => {
    const nm = ($('#pname').value || '').trim();
    state.name = nm || 'друг';
    state.started = true;
    saveState(); renderHUD(); showMap(); sndPop();
  };
  $('#startBtn').onclick = go;
  $('#pname').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

function showMap() {
  const view = $('#view');
  const doneCount = state.done.filter(Boolean).length;
  view.innerHTML = `
    <div class="card">
      <div class="row" style="align-items:flex-end">
        <div>
          <div class="st-kicker">Карта путешествия</div>
          <h2 style="margin:2px 0 0">Солнечный город</h2>
        </div>
        <div class="spacer"></div>
        <span class="chip">⭐ ${doneCount} из ${STATIONS.length}</span>
      </div>
      <p class="muted" style="margin:6px 0 16px">Станции открываются по порядку — как улицы в Солнечном городе.
      ${doneCount === STATIONS.length ? 'Все станции пройдены — забери свой диплом!' : 'Иди по маршруту и собирай звёздочки.'}</p>
      <div class="route-grid">
        ${STATIONS.map((s, i) => {
          const done = state.done[i];
          const locked = i > 0 && !state.done[i - 1];
          return `<button class="station-card ${done ? 'done' : ''} ${locked ? 'locked' : ''}" data-i="${i}" ${locked ? 'disabled' : ''}>
            <span class="num" style="background:${s.color}">${locked ? '🔒' : i + 1}</span>
            <span class="nm">${s.title}</span>
            <span class="sub">${done ? 'Пройдено — можно повторить' : locked ? 'Откроется после станции ' + i : 'Задание внутри'}</span>
            <span class="mark">${done ? '✅' : ''}</span>
            <span class="icon-big">${s.icon}</span>
          </button>`;
        }).join('')}
      </div>
      ${doneCount === STATIONS.length ? '<div class="row center" style="margin-top:18px"><button class="btn" id="toFinal">Получить диплом 🎉</button></div>' : ''}
    </div>`;
  $$('.station-card', view).forEach(b => {
    b.onclick = () => { if (!b.disabled) { sndPop(); openStation(+b.dataset.i); } };
  });
  const tf = $('#toFinal', view); if (tf) tf.onclick = showFinal;
}

function openStation(i, force) {
  if (!force && i > 0 && !state.done[i - 1]) { toast('Сначала пройди предыдущую станцию'); return; }
  current = i;
  const st = STATIONS[i];
  const view = $('#view');
  view.innerHTML = `
    <div class="card">
      <div class="st-top">
        <div>${charSVG(st.hero)}</div>
        <div>
          <div class="st-kicker">Станция ${i + 1} из ${STATIONS.length}</div>
          <h2 style="margin:2px 0 6px">${st.icon} ${st.title}</h2>
          <p class="muted" style="margin:0">${st.story}</p>
        </div>
      </div>
      <div class="task">
        <div class="task-head">
          <div class="qmark">?</div>
          <div class="txt">${st.task}</div>
        </div>
        <div class="progressline"><i id="pl"></i></div>
        <div id="stage"></div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="st-footer">
        <button class="btn ghost" id="back">← К карте</button>
        <div class="spacer"></div>
        <button class="btn green" id="next" style="display:none">Дальше →</button>
      </div>
    </div>`;

  const fb = $('#fb'), pl = $('#pl'), nextBtn = $('#next');
  const api = {
    step: (d, t) => { pl.style.width = Math.min(100, d / t * 100) + '%'; },
    ok: m => { fb.className = 'feedback ok'; fb.textContent = m || 'Молодец!'; },
    no: m => { fb.className = 'feedback no'; fb.textContent = m || 'Попробуй ещё.'; },
    finish: m => {
      pl.style.width = '100%';
      fb.className = 'feedback ok';
      fb.textContent = (m || 'Станция пройдена!') + ' ⭐';
      sndWin();
      if (!state.done[i]) { state.done[i] = true; saveState(); renderHUD(); }
      nextBtn.style.display = 'inline-block';
      nextBtn.textContent = (i === STATIONS.length - 1) ? 'К диплому →' : 'Следующая станция →';
      confettiBurst(16);
    }
  };
  $('#back').onclick = showMap;
  nextBtn.onclick = () => {
    if (i === STATIONS.length - 1) showFinal();
    else { openStation(i + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  };
  st.mount($('#stage', view), api);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showFinal() {
  const total = STATIONS.length;
  const done = state.done.filter(Boolean).length;
  const view = $('#view');
  const all = done === total;
  view.innerHTML = `
    <div class="card">
      <div class="cert">
        <div style="font-size:34px">☀️ 🎈 🚂</div>
        <h2>${all ? 'Диплом путешественника по Солнечному городу' : 'Почти получилось!'}</h2>
        <div class="name">${state.name || 'друг'}</div>
        <p style="font-size:17px;margin:6px 0">${all
          ? 'прошёл(ла) все девять станций, разгадал(а) загадки Незнайки, Кнопочки и Пачкули и получил(а) звание <b>почётного жителя Солнечного города</b>.'
          : 'прошёл(ла) ' + done + ' из ' + total + ' станций. Возвращайся на карту и продолжи путешествие!'}</p>
        <div class="stars-big">${Array.from({ length: total }, (_, i) => state.done[i] ? '⭐' : '☆').join(' ')}</div>
        ${all ? '<p class="small muted">Николай Носов, «Незнайка в Солнечном городе» · 1958</p>' : ''}
        <div class="row center" style="margin-top:16px">
          <button class="btn blue" id="toMap2">На карту</button>
          ${all ? '<button class="btn" id="again">Пройти снова</button>' : ''}
        </div>
      </div>
      <div class="row" style="justify-content:center;margin-top:6px;gap:2px">
        <div style="width:110px">${charSVG('neznaika')}</div>
        <div style="width:110px">${charSVG('knopochka')}</div>
        <div style="width:110px">${charSVG('pachkulya')}</div>
        <div style="width:110px">${charSVG('znayka')}</div>
      </div>
    </div>`;
  $('#toMap2').onclick = showMap;
  const ag = $('#again', view);
  if (ag) ag.onclick = () => {
    state.done = new Array(total).fill(false); saveState(); renderHUD();
    confettiBurst(40); showMap();
  };
  if (all) { confettiBurst(60); sndWin(); }
}

/* ---------- запуск ---------- */
loadState();
renderHUD();
if (state.started && state.name) showMap(); else showIntro();

// прямая ссылка на станцию: index.html#s3
const deep = (location.hash || '').match(/^#s([1-9])$/);
if (deep) {
  if (!state.name) state.name = 'друг';
  state.started = true;
  renderHUD();
  openStation(+deep[1] - 1, true);
}
window.addEventListener('hashchange', () => {
  const m2 = (location.hash || '').match(/^#s([1-9])$/);
  if (m2) openStation(+m2[1] - 1, true);
});

</script>
